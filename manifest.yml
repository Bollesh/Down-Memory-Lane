# Create the app at api.slack.com/apps → "From an app manifest" and paste this.
display_information:
  name: Down Memory Lane
  description: Generates imaginative childhood photos from a text description.
features:
  bot_user:
    display_name: Down Memory Lane
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:write
      - reactions:write
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
